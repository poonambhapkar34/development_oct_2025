<!-- HTML lists allow web developers to group a set of related items in lists. 
 1. unordered List <ul>
 2. Ordered List <ol>
 3. Discription List/Other Lists <dl>
    style(attribute =list-style-type(css property) : value )-->

<ul>
    <li>DDDDDDd</li>
    <li>BBBBBBBBBB</li>
    <li>JJJJJJJJJJJ</li>
</ul>

<ul style="list-style-type:upper-roman">
    <li>coffee</li>
    <li>Tea</li>
    <li>milk</li>
</ul>

<ol>
    <li>AAAAAAA</li>
    <li>BBBBBBBBBBBBB</li>
    <li>CCCCCCCCCCC</li>
</ol>

<ol type="I">
    <li>AAAAAAA</li>
    <li>BBBBBBBBBBBBB</li>
    <li>CCCCCCCCCCC</li>
</ol>

<dl>
    <dt>Mumbai</dt>
    <dd>-Mumbai is a beautiful metro city</dd>
    <dt>Pune</dt>
    <dd>-Pune is a good metro city</dd>
</dl>
<p>Test</p>
